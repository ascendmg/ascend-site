<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | Ascend Platform</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --black:#0f0e0c; --ivory:#f4ede2; --muted:#948d7d; --line:#3a352c;
    --platinum:#c9cdd3; --accent-1:#6366f1; --accent-2:#a855f7;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--black); color:var(--ivory); font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:400px; border:1px solid var(--line); border-radius:16px;
    padding:36px; background:rgba(255,255,255,.02);
  }
  h1{font-size:20px; font-weight:600; margin-bottom:8px;}
  p.sub{color:var(--muted); font-size:13.5px; margin-bottom:26px;}
  label{font-size:12px; color:var(--muted); display:block; margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em;}
  input{
    width:100%; background:#161412; border:1px solid var(--line); color:var(--ivory);
    padding:11px 14px; border-radius:8px; font-size:14px; margin-bottom:16px;
  }
  button{
    width:100%; padding:13px; background:linear-gradient(120deg,var(--accent-1),var(--accent-2));
    color:#fff; border:none; border-radius:8px; font-weight:600; font-size:14px; cursor:pointer;
  }
  button:disabled{opacity:.6; cursor:wait;}
  .msg{font-size:13px; margin-top:14px; min-height:18px;}
  .msg.error{color:#e07856;}
  .msg.success{color:#7dd3a8;}
  a{color:var(--platinum); font-size:13px;}
  .foot{margin-top:20px; text-align:center;}
</style>
</head>
<body>

<div class="card">
  <h1>Create your admin account</h1>
  <p class="sub">This creates the account you'll use to log into the Ascend platform.</p>

  <label>Email</label>
  <input type="email" id="email" placeholder="you@hqascend.com">

  <label>Password</label>
  <input type="password" id="password" placeholder="At least 8 characters">

  <button id="submitBtn">Create Account</button>
  <div class="msg" id="msg"></div>

  <div class="foot"><a href="login.html">Already have an account? Log in</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://nchcgzijogttbvmjizmk.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_8zu3WfaXZLOAh3utVGQloQ_HkjaPVD9';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');

  btn.addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    msg.textContent = '';
    msg.className = 'msg';

    if (!email || password.length < 8) {
      msg.textContent = 'Enter a valid email and a password of at least 8 characters.';
      msg.className = 'msg error';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Creating...';

    const { data, error } = await supabase.auth.signUp({ email, password });

    if (error) {
      msg.textContent = error.message;
      msg.className = 'msg error';
      btn.disabled = false;
      btn.textContent = 'Create Account';
      return;
    }

    // Try to claim admin role. This only succeeds if no admin exists yet
    // (see api/bootstrap-admin.js) — safe to call for everyone, but only
    // works once, for whoever gets there first.
    try {
      const res = await fetch('/api/bootstrap-admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: data.user?.id, email }),
      });
      const bootstrapResult = await res.json();

      if (res.ok && bootstrapResult.becameAdmin) {
        msg.textContent = 'Account created — you are the first admin. Check your email to confirm, then log in.';
      } else {
        msg.textContent = 'Account created. An existing admin needs to grant you access before you can log in. Check your email to confirm your address.';
      }
      msg.className = 'msg success';
    } catch (e) {
      msg.textContent = 'Account created, but role assignment failed. Contact an existing admin.';
      msg.className = 'msg error';
    }

    btn.textContent = 'Create Account';
  });
</script>

</body>
</html>
